name: xImJxstinn Vertical – Windows Build
on:
  push:
    branches: [main, master]
    tags: ['*']
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    name: Build für Windows 🪟
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version lesen
        id: setup
        run: |
          $BuildSpec = Get-Content -Path buildspec.json -Raw | ConvertFrom-Json
          "pluginVersion=$($BuildSpec.version)" >> $env:GITHUB_OUTPUT

      - name: Plugin bauen 🧱
        uses: ./.github/actions/build-plugin
        with:
          target: x64
          config: RelWithDebInfo

      - name: Installer erstellen 📀
        run: |
          iscc "/DMyAppVersion=${{ steps.setup.outputs.pluginVersion }}" "/O$env:GITHUB_WORKSPACE\release" installer\ximjxstinn-vertical.iss

      - name: ZIP erstellen
        run: |
          Compress-Archive -Force -Path release\RelWithDebInfo\ximjxstinn-vertical -DestinationPath release\ximjxstinn-vertical-${{ steps.setup.outputs.pluginVersion }}-windows-manuell.zip

      - name: Download bereitstellen 📡
        uses: actions/upload-artifact@v4
        with:
          name: ximjxstinn-vertical-${{ steps.setup.outputs.pluginVersion }}-windows
          path: |
            release/*.exe
            release/*.zip

      - name: An Release anhängen 🛫
        if: github.event_name == 'release' || github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release/*.exe
            release/*.zip
