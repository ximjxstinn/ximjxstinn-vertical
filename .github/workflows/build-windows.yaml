name: xImJxstinn Stream Tools – Windows Build
on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    name: Build für Windows 🪟
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version lesen
        id: setup
        run: |
          $BuildSpec = Get-Content -Path buildspec.json -Raw | ConvertFrom-Json
          "pluginVersion=$($BuildSpec.version)" >> $env:GITHUB_OUTPUT

      - name: Plugin bauen 🧱
        uses: ./.github/actions/build-plugin
        with:
          target: x64
          config: RelWithDebInfo

      - name: Installer erstellen 📀
        run: |
          iscc "/DMyAppVersion=${{ steps.setup.outputs.pluginVersion }}" "/O$env:GITHUB_WORKSPACE\release" installer\ximjxstinn-streamtools.iss

      - name: ZIP erstellen
        run: |
          Compress-Archive -Force -Path release\RelWithDebInfo\ximjxstinn-streamtools -DestinationPath release\ximjxstinn-streamtools-${{ steps.setup.outputs.pluginVersion }}-windows-manuell.zip

      - name: Download bereitstellen 📡
        uses: actions/upload-artifact@v4
        with:
          name: ximjxstinn-streamtools-${{ steps.setup.outputs.pluginVersion }}-windows
          path: |
            release/*.exe
            release/*.zip

      - name: Release für Auto-Update veröffentlichen 🛫
        if: github.event_name == 'push' && github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.setup.outputs.pluginVersion }}
          name: xImJxstinn Stream Tools ${{ steps.setup.outputs.pluginVersion }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: ${{ github.event.head_commit.message }}
          files: |
            release/*.exe
            release/*.zip

      - name: An bestehendes Release anhängen
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release/*.exe
            release/*.zip
